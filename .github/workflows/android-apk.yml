# Builds the FRISL Scan Android app (android/). On main, publishes the APK as the
# "apk-latest" GitHub release so it can be downloaded straight onto the handheld:
#   https://github.com/FrisSoftwareteam/FRIS-Asset-management-/releases/download/apk-latest/frisl-scan.apk
name: Android APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Keep the same signing key between builds so new versions install over old ones.
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: frisl-scan-debug-keystore-v1

      - name: Create signing key if missing
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=FRISL Scan, O=First Registrars, C=NG"
          fi

      - name: Build APK
        run: |
          set +e
          gradle -p android assembleRelease -PversionCode=${{ github.run_number }} --no-daemon --stacktrace 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Surface the real errors as annotations (readable without opening the log).
            grep -E "^e: |error:|ERROR|What went wrong|Could not|> |FAILURE|Exception" build.log | grep -v "^\s*at " | head -40 | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi
          exit $status

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk frisl-scan.apk

      - uses: actions/upload-artifact@v4
        with:
          name: frisl-scan-apk
          path: frisl-scan.apk

      - name: Publish download link (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest frisl-scan.apk \
            --title "FRISL Scan (Android) – build ${{ github.run_number }}" \
            --notes "Install on the handheld: open this page on the device, tap frisl-scan.apk, allow installing from this source. Build ${{ github.run_number }} from ${{ github.sha }}." \
            --target ${{ github.sha }}
